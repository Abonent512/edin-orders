<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#799d5a" stroke-width="1.6"/></marker></defs><rect width="1200" height="670" fill="#f6f8f1"/><g font-family="Arial,sans-serif"><text x="55" y="65" fill="#1d4330" font-size="34" font-weight="bold">ЕДИН · Web + Mobile</text><text x="55" y="96" fill="#849774" font-size="16">Общий API, серверные роли и согласованные данные заказов</text><g fill="#fff" stroke="#d7e3c9" stroke-width="2"><rect x="55" y="170" width="260" height="120" rx="15"/><rect x="55" y="365" width="260" height="120" rx="15"/><rect x="440" y="220" width="310" height="215" rx="15"/><rect x="870" y="220" width="275" height="125" rx="15"/><rect x="870" y="395" width="275" height="105" rx="15"/></g><g fill="#274d34" font-size="21" font-weight="bold"><text x="80" y="210">Веб-клиент</text><text x="80" y="405">Android + Mobile UI</text><text x="465" y="260">FastAPI · /api/v1</text><text x="895" y="260">Постоянная БД</text><text x="895" y="433">События и журнал</text></g><g fill="#899d76" font-size="15"><text x="80" y="241">React · каталог · заказы</text><text x="80" y="265">JWT в памяти клиента</text><text x="80" y="438">APK · HTTPS · общий аккаунт</text><text x="80" y="462">PWA как вариант установки</text><text x="465" y="299">JWT + HttpOnly refresh cookie</text><text x="465" y="331">Роли покупатель / оператор</text><text x="465" y="363">Цены, остатки, версии, идемпотентность</text><text x="465" y="399">REST + авторизованный SSE</text><text x="895" y="294">PostgreSQL в облаке</text><text x="895" y="322">SQLite для одного VPS/демо</text><text x="895" y="464">order_events · request ID</text></g><g stroke="#799d5a" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M315 227H378V277H438"/><path d="M315 423H378V370H438"/><path d="M750 282H868"/><path d="M750 382H810V448H868"/><path d="M1007 345V393"/></g><g fill="#799d5a" font-size="12"><text x="334" y="207">HTTPS REST</text><text x="330" y="477">SSE: статусы</text><text x="762" y="270">Транзакции</text></g><rect x="55" y="550" width="1090" height="67" rx="12" fill="#e7efd9"/><text x="80" y="578" fill="#45683b" font-size="15">Размещение: Render Free + внешняя PostgreSQL / российский VPS + Docker + Caddy</text><text x="80" y="602" fill="#879f73" font-size="13">Данные не зависят от процесса API. Резервные копии, переподключение SSE, проверки прав — на сервере.</text></g></svg>