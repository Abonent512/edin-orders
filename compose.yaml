name: edin
services:
  api:
    build: .
    image: edin-orders:local
    restart: unless-stopped
    env_file: .env
    environment:
      FORWARDED_ALLOW_IPS: '*'
    volumes:
      - orders_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  backup:
    image: edin-orders:local
    restart: unless-stopped
    env_file: .env
    command: [python, -m, app.maintenance, --loop, --directory, /backups]
    volumes:
      - orders_data:/app/data
      - orders_backups:/backups
    read_only: true
    tmpfs: [/tmp:size=64m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  orders_data:
  orders_backups:
  caddy_data:
  caddy_config:
